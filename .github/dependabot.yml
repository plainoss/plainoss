version: 2
updates:
  # Maintain dependencies for root and packages
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore(deps)'

  # Maintain GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    groups:
      actions-dependencies:
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'actions'
    commit-message:
      prefix: 'chore(actions)'
