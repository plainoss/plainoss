name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter & Formatter Check
        run: pnpm run format:check

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Unit Tests
        run: pnpm run test

      - name: Test Android release verification and retry logic
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: Build Packages & Apps
        run: pnpm run build

  verify-android:
    name: Android Build, Lint & Shared Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ar-ruler-mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android app and shared core
        run: ./gradlew :shared:jvmTest :androidApp:lintDebug :androidApp:assembleDebug

      - name: Check release bundle with an ephemeral key (no repository secrets)
        working-directory: .
        shell: bash
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release-check.jks"
          export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS=release-check
          export ANDROID_VERSION_CODE=1
          export ANDROID_VERSION_NAME=0.1.0-check
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          "$JAVA_HOME/bin/keytool" -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" \
            -storetype JKS -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 3072 \
            -validity 2 -dname 'CN=Disposable CI Release Check' \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD
          export ANDROID_UPLOAD_CERTIFICATE_SHA256="$("$JAVA_HOME/bin/keytool" -exportcert \
            -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD | sha256sum | cut -d ' ' -f 1)"
          bash tools/release/build.sh "$GITHUB_WORKSPACE/release-check"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ar-ruler-mobile-debug-apk
          path: apps/ar-ruler-mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Android verification reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ar-ruler-mobile-verification-reports
          path: |
            apps/ar-ruler-mobile/shared/build/reports/
            apps/ar-ruler-mobile/androidApp/build/reports/
            release-check/verification.txt
            release-check/release.json
          if-no-files-found: ignore
