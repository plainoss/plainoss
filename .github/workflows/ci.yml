name: CI

on:
  push:
    branches: [main, "feat/*", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter & Formatter Check
        run: pnpm run format:check

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Unit Tests
        run: pnpm run test

      - name: Build Web Apps & Core Packages
        run: pnpm run build

  build-artifacts:
    name: Build Mobile Artifacts & Android APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Mobile Standalone Bundle
        run: pnpm --filter mobile-ar-ruler build --output-dir dist

      - name: Upload Mobile Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ar-ruler-bundle
          path: apps/mobile-ar-ruler/dist
          retention-days: 14

      - name: Prebuild Native Android Project
        run: |
          cd apps/mobile-ar-ruler
          npx expo prebuild --platform android --clean --no-install

      - name: Build Android Debug APK
        run: |
          cd apps/mobile-ar-ruler/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ar-ruler-android-debug-apk
          path: apps/mobile-ar-ruler/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
