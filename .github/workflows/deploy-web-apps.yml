name: Deploy Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-*/**'
      - 'packages/core/**'

jobs:
  build-and-deploy:
    name: Build Web Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Apps via Turborepo
        run: pnpm run build
