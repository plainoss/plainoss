name: Deploy Web Apps

on:
  push:
    branches: [main]
    paths:
      - "apps/web-*/**"
      - "packages/core/**"

jobs:
  build-and-deploy:
    name: Build Web Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Keep Node 22 current, with the CVE-2026-111497 fix as the minimum.
          node-version: "^22.23.4"
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Apps via Turborepo
        run: pnpm run build
