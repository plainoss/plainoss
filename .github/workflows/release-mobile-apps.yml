name: Build Mobile APK Artifact

on:
  push:
    tags:
      - "mobile-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ar-ruler-mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and build Android APK
        run: ./gradlew :shared:jvmTest :androidApp:lintDebug :androidApp:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ar-ruler-mobile-debug-apk
          path: apps/ar-ruler-mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Android verification reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ar-ruler-mobile-verification-reports
          path: |
            apps/ar-ruler-mobile/shared/build/reports/
            apps/ar-ruler-mobile/androidApp/build/reports/
          if-no-files-found: ignore
